    <div class="row" data-id="${l.id}">
      <div class="row-main" data-action="open" style="cursor:pointer;">
        <div class="row-title">${esc(l.name)}</div>
        ${l.description ? `<div class="row-meta">${esc(l.description)}</div>` : ''}
        <div class="row-meta" style="color:var(--primary); word-break:break-all;">${esc(l.url)}</div>
      </div>
      <div class="row-actions">
        <button class="btn-icon" data-action="edit">✎</button>
        <button class="btn-icon" data-action="delete">🗑</button>
      </div>
    </div>`;
}
function afterRenderLinks() {
  document.getElementById('link-search').addEventListener('input', e => { linksSearch = e.target.value; render(); document.getElementById('link-search').focus(); });
  document.getElementById('links-report-pdf-btn').addEventListener('click', downloadLinksReportPDF);
  document.querySelectorAll('#link-list .row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-action="open"]').addEventListener('click', () => {
      const l = state.links.find(x => x.id === id);
      if (l) window.open(l.url, '_blank', 'noopener,noreferrer');
    });
    row.querySelector('[data-action="edit"]').addEventListener('click', () => openLinkModal(state.links.find(x => x.id === id)));
    row.querySelector('[data-action="delete"]').addEventListener('click', () => {
      confirmDialog('Delete link?', 'This link will be permanently removed.', () => {
        state.links = state.links.filter(x => x.id !== id); persist('links'); render(); showToast('Link deleted');
      });
    });
  });
}
function normalizeUrl(raw) {
  const url = raw.trim();
  if (!url) return url;
  return /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(url) ? url : 'https://' + url;
}
function openLinkModal(item) {
  const editing = !!item;
  openModal(`
    <div class="modal-head"><h3>${editing ? 'Edit link' : 'Add link'}</h3><button class="btn-icon" id="modal-close">✕</button></div>
    <div class="field"><label>Name</label><input id="f-name" autocomplete="off" value="${esc(item?.name||'')}" placeholder="e.g. Company handbook"></div>
    <div class="field"><label>URL</label><input id="f-url" autocomplete="off" value="${esc(item?.url||'')}" placeholder="e.g. example.com/page" type="url"></div>
    <div class="field"><label>Description (optional)</label><textarea id="f-desc" autocomplete="off" placeholder="Add any extra detail">${esc(item?.description||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">${editing?'Save changes':'Add link'}</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    const url = normalizeUrl(document.getElementById('f-url').value);
    if (!name) { showToast('Please enter a name', 'error'); return; }
    if (!url) { showToast('Please enter a URL', 'error'); return; }
    const data = { name, url, description: document.getElementById('f-desc').value.trim() };
    if (editing) { Object.assign(item, data); showToast('Link updated'); }
    else { state.links.push({ id: uid(), ...data }); showToast('Link added'); }
    persist('links'); closeModal(); render();
  });
}
function downloadLinksReportPDF() {
  const rows = [...state.links].sort((a, b) => a.name.localeCompare(b.name)).map(l => [l.name, l.url, l.description || '']);
  downloadPDFReport(
    'Saved Links — DailyLife',
    ['Name', 'URL', 'Description'],
    rows,
    `links-report-${todayISO()}.pdf`,
    [`Total links: ${state.links.length}`]
  );
}

/* ============================== NOTES ============================== */
function renderNotesPage() {
  const filtered = state.notes.filter(n => !notesSearch || n.title.toLowerCase().includes(notesSearch.toLowerCase()) || n.body.toLowerCase().includes(notesSearch.toLowerCase()));
  const pinned = filtered.filter(n => n.pinned);
  const rest = filtered.filter(n => !n.pinned);
  return `
    <div class="page-header">
      <div><h2>Notes</h2><div class="sub">${state.notes.length} notes</div></div>
    </div>
    ${state.notes.length ? `<div class="card" style="margin-bottom:16px; display:flex; gap:20px; align-items:center;">
      <div><div class="card-title">Total</div><div class="stat-value">${state.notes.length}</div></div>
      <div><div class="card-title">Pinned</div><div class="stat-value">${state.notes.filter(n=>n.pinned).length}</div></div>
      <div style="flex:1; max-width:160px; height:70px;"><canvas id="note-chart"></canvas></div>
    </div>` : ''}
    <div class="searchbar"><span class="ic">🔍</span><input id="note-search" autocomplete="off" placeholder="Search notes..." value="${esc(notesSearch)}"></div>
    ${pinned.length ? `<div class="section-title">📌 Pinned</div><div class="grid grid-3" id="pinned-notes">${pinned.map(noteCard).join('')}</div>` : ''}
    <div class="section-title">${pinned.length ? 'All notes' : ''}</div>
    <div class="grid grid-3" id="note-grid">${rest.length ? rest.map(noteCard).join('') : (filtered.length===0 ? emptyState('📝','No notes found','Create a note to capture your thoughts') : '')}</div>
  `;
}
function noteCard(n) {
  return `
    <div class="note-card ${n.pinned?'pinned':''}" data-id="${n.id}">
      ${n.pinned ? '<span class="pin-badge">📌</span>' : ''}
      <div class="note-title">${esc(n.title)}</div>
      <div class="note-body">${esc(n.body)}</div>
      <div class="note-date">${fmtDate(n.updatedAt)}</div>
    </div>`;
}
function afterRenderNotes() {
  const searchInput = document.getElementById('note-search');
  searchInput.addEventListener('input', e => {
    notesSearch = e.target.value;
    render();
    const el = document.getElementById('note-search');
    el.focus(); el.setSelectionRange(notesSearch.length, notesSearch.length);
  });
  document.querySelectorAll('.note-card').forEach(card => {
    card.addEventListener('click', () => openNoteModal(state.notes.find(x => x.id === card.dataset.id)));
  });
  if (state.notes.length) {
    const pinned = state.notes.filter(n => n.pinned).length;
    chartRefs.note = new Chart(document.getElementById('note-chart'), {
      type: 'doughnut',
      data: { labels: ['Pinned','Unpinned'], datasets: [{ data: [pinned, state.notes.length - pinned], backgroundColor: ['#E8A33D','#E7E3DA'], borderWidth: 0 }] },
      options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '70%' }
    });
  }
}
function openNoteModal(item) {
  const editing = !!item;
  openModal(`
    <div class="modal-head"><h3>${editing?'Edit note':'New note'}</h3><button class="btn-icon" id="modal-close">✕</button></div>
    <div class="field"><label>Title</label><input id="f-title" autocomplete="off" value="${esc(item?.title||'')}" placeholder="Note title"></div>
    <div class="field"><label>Content</label><textarea id="f-body" autocomplete="off" class="note-content-textarea">${esc(item?.body||'')}</textarea></div>
    <div class="field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="f-pinned" ${item?.pinned?'checked':''} style="width:auto;"> <label style="margin:0;">Pin this note</label>
    </div>
    <div class="modal-actions">
      ${editing ? '<button class="btn btn-danger" id="modal-delete">Delete</button>' : ''}
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">${editing?'Save changes':'Create note'}</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  if (editing) document.getElementById('modal-delete').addEventListener('click', () => {
    confirmDialog('Delete note?', 'This note will be permanently removed.', () => {
      state.notes = state.notes.filter(x => x.id !== item.id); persist('notes'); closeModal(); render(); showToast('Note deleted');
    });
  });
  document.getElementById('modal-save').addEventListener('click', () => {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { showToast('Please enter a title', 'error'); return; }
    const data = { title, body: document.getElementById('f-body').value.trim(), pinned: document.getElementById('f-pinned').checked, updatedAt: todayISO() };

}

/* ============================== QUOTES ============================== */
let quotesSearch = '';
let quoteCategoryFilter = 'all';
function getQuoteCategories() {
  return Array.from(new Set(state.quotes.map(q => q.category).filter(Boolean))).sort((a, b) => a.localeCompare(b));
}
function renderQuotesPage() {
  const categories = getQuoteCategories();
  const filtered = state.quotes.filter(q => {
    if (quoteCategoryFilter !== 'all' && q.category !== quoteCategoryFilter) return false;
    if (!quotesSearch) return true;
    const needle = quotesSearch.toLowerCase();
    return q.text.toLowerCase().includes(needle) || (q.author || '').toLowerCase().includes(needle) || (q.category || '').toLowerCase().includes(needle);
  });
  return `
    <div class="page-header">
      <div><h2>Quotes</h2><div class="sub">${state.quotes.length} saved quote${state.quotes.length === 1 ? '' : 's'}</div></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" id="quotes-csv-btn">⬇ CSV</button>
        <button class="btn btn-secondary btn-sm" id="quotes-pdf-btn">⬇ PDF</button>
      </div>
    </div>
    ${categories.length ? `
    <div class="tabs" id="quote-category-tabs">
      <div class="tab ${quoteCategoryFilter==='all'?'active':''}" data-qcat="all">All</div>
      ${categories.map(c => `<div class="tab ${quoteCategoryFilter===c?'active':''}" data-qcat="${esc(c)}">${esc(c)}</div>`).join('')}
    </div>` : ''}
    ${state.quotes.length ? `<div class="searchbar"><span class="ic">🔍</span><input id="quote-search" autocomplete="off" placeholder="Search quotes..." value="${esc(quotesSearch)}"></div>` : ''}
    <div class="grid grid-3" id="quote-grid">${filtered.length ? filtered.map(quoteCard).join('') : emptyState('💬', 'No quotes saved yet', 'Add a quote with the + button below')}</div>
  `;
}
function quoteCard(q) {
  return `
    <div class="note-card" data-id="${q.id}">
      ${q.category ? `<span class="pill" style="position:absolute; top:12px; right:12px; background:var(--primary-light); color:var(--primary); font-size:10px;">${esc(q.category)}</span>` : ''}
      <div class="note-body" style="font-style:italic; -webkit-line-clamp:5; white-space:pre-wrap;">“${esc(q.text)}”</div>
      ${q.author ? `<div class="note-date" style="font-weight:700; color:var(--ink);">— ${esc(q.author)}</div>` : ''}
    </div>`;
}
function afterRenderQuotes() {
  const searchInput = document.getElementById('quote-search');
  if (searchInput) searchInput.addEventListener('input', e => {
    quotesSearch = e.target.value;
    render();
    const el = document.getElementById('quote-search');
    if (el) { el.focus(); el.setSelectionRange(quotesSearch.length, quotesSearch.length); }
  });
  document.querySelectorAll('[data-qcat]').forEach(el => el.addEventListener('click', () => { quoteCategoryFilter = el.dataset.qcat; render(); }));
  document.querySelectorAll('#quote-grid .note-card').forEach(card => {
    card.addEventListener('click', () => openQuoteModal(state.quotes.find(x => x.id === card.dataset.id)));
  });
  document.getElementById('quotes-csv-btn').addEventListener('click', downloadQuotesReport);
  document.getElementById('quotes-pdf-btn').addEventListener('click', downloadQuotesReportPDF);
}
function openQuoteModal(item) {
  const editing = !!item;
  const existingCategories = getQuoteCategories();
  openModal(`
    <div class="modal-head"><h3>${editing ? 'Edit quote' : 'Add quote'}</h3><button class="btn-icon" id="modal-close">✕</button></div>
    <div class="field"><label>Quote</label><textarea id="f-text" autocomplete="off" class="note-content-textarea" placeholder="Write the quote here">${esc(item?.text||'')}</textarea></div>
    <div class="field"><label>Author (optional)</label><input id="f-author" autocomplete="off" value="${esc(item?.author||'')}" placeholder="e.g. Marcus Aurelius"></div>
    <div class="field">
      <label>Category</label>
      <input id="f-quote-category" autocomplete="off" list="quote-category-list" value="${esc(item?.category||'')}" placeholder="e.g. Motivation, Love, Life">
      <datalist id="quote-category-list">${existingCategories.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    </div>
    <div class="modal-actions">
      ${editing ? '<button class="btn btn-danger" id="modal-delete">Delete</button>' : ''}
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">${editing?'Save changes':'Add quote'}</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  if (editing) document.getElementById('modal-delete').addEventListener('click', () => {
    confirmDialog('Delete quote?', 'This quote will be permanently removed.', () => {
      state.quotes = state.quotes.filter(x => x.id !== item.id); persist('quotes'); closeModal(); render(); showToast('Quote deleted');
    });
  });
  document.getElementById('modal-save').addEventListener('click', () => {
    const rawText = document.getElementById('f-text').value;
    if (!rawText.trim()) { showToast('Please write a quote', 'error'); return; }
    const category = document.getElementById('f-quote-category').value.trim();
    if (!category) { showToast('Please enter a category for this quote', 'error'); return; }
    // Store exactly as typed — no trimming — so intentional formatting (indentation, line breaks,
    // leading/trailing spacing in a poem or quote) survives. Author and category are trimmed,
    // since neither has a reason to carry stray whitespace.
    const data = { text: rawText, author: document.getElementById('f-author').value.trim(), category };
    if (editing) { Object.assign(item, data); showToast('Quote updated'); }
    else { state.quotes.push({ id: uid(), ...data, date: todayISO() }); showToast('Quote added'); }
    persist('quotes'); closeModal(); render();
  });
}
function downloadQuotesReport() {
  const rows = [['Quote','Author','Category','Date added']];
  state.quotes.forEach(q => rows.push([q.text, q.author || '', q.category || '', q.date || '']));
  downloadBlob(`quotes-${todayISO()}.csv`, toCSV(rows), 'text/csv');
  showToast('Quotes exported');
}
function downloadQuotesReportPDF() {
  const rows = state.quotes.map(q => [q.text, q.author || '—', q.category || '—']);
  downloadPDFReport(
    'Saved Quotes — DailyLife',
    ['Quote','Author','Category'],
    rows,
    `quotes-${todayISO()}.pdf`,
    [`Total quotes: ${state.quotes.length}`]
  );
}

/* ============================== BILLS & SUBSCRIPTIONS ============================== */
function renderBillsPage() {
  const sorted = [...state.bills].sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const upcoming = sorted.filter(b => b.status !== 'Paid' && daysBetween(b.dueDate) >= 0 && daysBetween(b.dueDate) <= 7);
  const pendingTotal = sum(sorted.filter(b => b.status !== 'Paid'));
  return `
    <div class="page-header">
      <div><h2>Bills & Subscriptions</h2><div class="sub">${sorted.filter(b=>b.status!=='Paid').length} pending · ${fmtMoney(pendingTotal)}</div></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" id="bills-report-csv-btn">⬇ CSV</button>
        <button class="btn btn-secondary btn-sm" id="bills-report-pdf-btn">⬇ PDF</button>
      </div>
    </div>
    ${upcoming.length ? `<div class="alert-banner warn">⏰ ${upcoming.length} payment${upcoming.length>1?'s':''} due within 7 days</div>` : ''}
    ${sorted.length ? `<div class="card" style="margin-bottom:16px;"><div class="card-title">Status breakdown</div><div class="chart-wrap" style="height:170px;"><canvas id="bill-chart"></canvas></div></div>` : ''}
    <div class="list" id="bill-list">${sorted.length ? sorted.map(billRow).join('') : emptyState('💳','No bills tracked yet','Add a recurring payment with the + button below')}</div>
  `;
}
function billRow(b) {
  const d = daysBetween(b.dueDate);
  const overdue = b.status !== 'Paid' && d < 0;
  const statusColor = b.status === 'Paid' ? 'var(--primary)' : overdue ? 'var(--danger)' : 'var(--accent)';
  return `
    <div class="row" data-id="${b.id}">
      <div class="row-main">
        <div class="row-title">${esc(b.name)}</div>
        <div class="row-meta">
          <span class="pill" style="background:${statusColor}22; color:${statusColor}">${overdue && b.status!=='Paid' ? 'Overdue' : b.status}</span>
          <span>Due ${fmtDate(b.dueDate)}</span>
          <span>↻ ${b.repeat}</span>
        </div>
        ${b.description ? `<div class="row-meta">${esc(b.description)}</div>` : ''}
      </div>
      <div style="font-weight:800;">${fmtMoney(b.amount)}</div>
      <div class="row-actions">
        <button class="btn-icon" data-action="edit">✎</button>
        <button class="btn-icon" data-action="delete">🗑</button>
      </div>
    </div>`;
}
function afterRenderBills() {
  document.getElementById('bills-report-csv-btn').addEventListener('click', downloadBillsReport);
  document.getElementById('bills-report-pdf-btn').addEventListener('click', downloadBillsReportPDF);
  document.querySelectorAll('#bill-list .row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-action="edit"]').addEventListener('click', () => openBillModal(state.bills.find(x => x.id === id)));
    row.querySelector('[data-action="delete"]').addEventListener('click', () => {
      confirmDialog('Delete bill?', 'This bill will be permanently removed.', () => {
        state.bills = state.bills.filter(x => x.id !== id); persist('bills'); render(); showToast('Bill deleted');
      });
    });
  });
  if (state.bills.length) {
    const byStatus = { Paid: 0, Upcoming: 0, Overdue: 0 };
    state.bills.forEach(b => { const st = b.status === 'Paid' ? 'Paid' : (daysBetween(b.dueDate) < 0 ? 'Overdue' : 'Upcoming'); byStatus[st]++; });
    chartRefs.bill = new Chart(document.getElementById('bill-chart'), {
      type: 'doughnut',
      data: { labels: Object.keys(byStatus), datasets: [{ data: Object.values(byStatus), backgroundColor: ['#0E7C66','#E8A33D','#D64545'], borderWidth: 0 }] },
      options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10 } } } }, maintainAspectRatio: false }
    });
  }
}
function downloadBillsReport() {
  const rows = [['Name','Amount','Due Date','Repeat','Status','Description']];
  state.bills.forEach(b => rows.push([b.name, b.amount, b.dueDate, b.repeat, b.status, b.description || '']));
  downloadBlob(`bills-report-${todayISO()}.csv`, toCSV(rows), 'text/csv');
  showToast('Report downloaded');
}
function downloadBillsReportPDF() {
  const pendingTotal = sum(state.bills.filter(b => b.status !== 'Paid'));
  const rows = [...state.bills]
    .sort((a, b) => a.dueDate.localeCompare(b.dueDate))
    .map(b => [b.name, fmtMoneyPDF(b.amount), fmtDate(b.dueDate), b.repeat, b.status]);
  downloadPDFReport(
    'Bills & Subscriptions — DailyLife',
    ['Name','Amount','Due Date','Repeat','Status'],
    rows,
    `bills-report-${todayISO()}.pdf`,
    [`Total pending: ${fmtMoneyPDF(pendingTotal)}`, `Total tracked bills: ${state.bills.length}`]
  );
}
function openBillModal(item) {
  const editing = !!item;
  openModal(`
    <div class="modal-head"><h3>${editing?'Edit bill':'Add bill'}</h3><button class="btn-icon" id="modal-close">✕</button></div>
    <div class="field"><label>Name</label><input id="f-name" autocomplete="off" value="${esc(item?.name||'')}" placeholder="e.g. Electricity"></div>
    <div class="field-row">
      <div class="field"><label>Amount</label><input id="f-amount" autocomplete="off" type="number" step="0.01" value="${item?.amount??''}"></div>
      <div class="field"><label>Due date</label><input id="f-due" autocomplete="off" type="date" value="${item?.dueDate||todayISO()}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Repeat</label><select id="f-repeat">${REPEAT_OPTIONS.filter(o=>o!=='None').map(o=>`<option ${item?.repeat===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Status</label><select id="f-status">${BILL_STATUS.map(s=>`<option ${item?.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Description (optional)</label><textarea id="f-desc" autocomplete="off" placeholder="Add any extra detail">${esc(item?.description||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">${editing?'Save changes':'Add bill'}</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    const amount = parseFloat(document.getElementById('f-amount').value);
    if (!name || !amount) { showToast('Please fill in name and amount', 'error'); return; }
    const data = { name, amount, dueDate: document.getElementById('f-due').value || todayISO(), repeat: document.getElementById('f-repeat').value, status: document.getElementById('f-status').value, description: document.getElementById('f-desc').value.trim() };
    if (editing) { Object.assign(item, data); showToast('Bill updated'); }
    else { state.bills.push({ id: uid(), ...data }); showToast('Bill added'); }

/* ============================== DOCUMENTS & WARRANTY ============================== */
function renderDocumentsPage() {
  const sorted = [...state.documents].sort((a, b) => (a.expiryDate||'9999').localeCompare(b.expiryDate||'9999'));
  const expiringSoon = sorted.filter(d => d.expiryDate && daysBetween(d.expiryDate) >= 0 && daysBetween(d.expiryDate) <= 30);
  return `
    <div class="page-header">
      <div><h2>Documents & Warranty</h2><div class="sub">Track important documents & warranties</div></div>
    </div>
    ${expiringSoon.map(d => `<div class="alert-banner">⚠️ ${esc(d.name)} expires in ${daysBetween(d.expiryDate)} day${daysBetween(d.expiryDate)===1?'':'s'}.</div>`).join('')}
    ${sorted.length ? `<div class="card" style="margin-bottom:16px;"><div class="card-title">Expiry status</div><div class="chart-wrap" style="height:170px;"><canvas id="doc-chart"></canvas></div></div>` : ''}
    <div class="list" id="doc-list">${sorted.length ? sorted.map(docRow).join('') : emptyState('📄','No documents saved','Add a document or warranty with the + button below')}</div>
  `;
}
function docRow(d) {
  const days = d.expiryDate ? daysBetween(d.expiryDate) : null;
  const expired = days !== null && days < 0;
  const soon = days !== null && days >= 0 && days <= 30;
  return `
    <div class="row" data-id="${d.id}">
      <div class="row-main">
        <div class="row-title">${esc(d.name)}</div>
        <div class="row-meta">
          <span class="pill" style="background:var(--surface-2); color:var(--muted);">${d.type}</span>
          ${d.expiryDate ? `<span style="color:${expired?'var(--danger)':soon?'var(--accent)':'var(--muted)'}">${expired?'Expired ':'Expires '}${fmtDate(d.expiryDate)}</span>` : '<span>No expiry</span>'}
        </div>
        ${d.notes ? `<div class="row-meta">${esc(d.notes)}</div>` : ''}
      </div>
      <div class="row-actions">
        <button class="btn-icon" data-action="edit">✎</button>

function afterRenderDocuments() {
  document.querySelectorAll('#doc-list .row').forEach(row => {

    row.querySelector('[data-action="edit"]').addEventListener('click', () => openDocModal(state.documents.find(x => x.id === id)));
    row.querySelector('[data-action="delete"]').addEventListener('click', () => {
      confirmDialog('Delete document?', 'This document record will be permanently removed.', () => {
        state.documents = state.documents.filter(x => x.id !== id); persist('documents'); render(); showToast('Document deleted');
      });
    });
  });
  if (state.documents.length) {
    const buckets = { Expired: 0, 'Expiring soon': 0, Valid: 0, 'No expiry': 0 };
    state.documents.forEach(d => {
      if (!d.expiryDate) buckets['No expiry']++;
      else { const n = daysBetween(d.expiryDate); if (n < 0) buckets.Expired++; else if (n <= 30) buckets['Expiring soon']++; else buckets.Valid++; }
    });
    chartRefs.doc = new Chart(document.getElementById('doc-chart'), {
      type: 'doughnut',
      data: { labels: Object.keys(buckets), datasets: [{ data: Object.values(buckets), backgroundColor: ['#D64545','#E8A33D','#0E7C66','#8A8578'], borderWidth: 0 }] },
      options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10 } } } }, maintainAspectRatio: false }
    });

    </div>
  `);

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', () => {

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; showInstallBanner(); });

/* ===================== Install banner: nudges people opening this in a plain browser tab to install it ===================== */
let installBannerShown = false;
function isRunningStandalone() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function shouldOfferInstallBanner() {
  if (isRunningStandalone()) return false; // already installed/running as an app
  const dismissedAt = Number(localStorage.getItem('dailylife_install_dismissed_at') || 0);
  if (dismissedAt && Date.now() - dismissedAt < 7 * 24 * 60 * 60 * 1000) return false; // don't nag more than once a week
  return true;
}
function showInstallBanner() {
  if (installBannerShown || document.getElementById('install-banner') || !shouldOfferInstallBanner()) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (!deferredInstallPrompt && !isIOS) return; // nothing actionable to offer on this platform yet
  installBannerShown = true;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.className = 'install-banner';
  banner.innerHTML = `
    <div class="install-banner-icon">DL</div>
    <div class="install-banner-text">
      <div class="install-banner-title">Install DailyLife</div>
      <div class="install-banner-sub">${isIOS ? 'Tap the Share icon, then "Add to Home Screen"' : 'Add it to your home screen for the full app experience'}</div>
    </div>
    ${!isIOS ? '<button class="btn btn-primary btn-sm" id="install-banner-btn">Install</button>' : ''}
    <button class="btn-icon" id="install-banner-close">✕</button>
  `;
  document.body.insertBefore(banner, document.body.firstChild);
  document.getElementById('install-banner-close').addEventListener('click', dismissInstallBanner);
  const installBtn = document.getElementById('install-banner-btn');
  if (installBtn) installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) { dismissInstallBanner(); return; }
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    dismissInstallBanner();
  });
}
function dismissInstallBanner() {
  const el = document.getElementById('install-banner');
  if (el) el.remove();
  installBannerShown = false;
  try { localStorage.setItem('dailylife_install_dismissed_at', String(Date.now())); } catch (e) { /* ignore */ }
}

  openModal(`

    <div class="modal-actions">

      if (hash !== state.settings.security.passwordHash) { showToast('Current PIN is incorrect', 'error'); return; }
    }
    if (mode === 'disable') {
      state.settings.security = { enabled: false, passwordHash: null, salt: null, biometricEnabled: false, credentialId: null };
      persist('settings'); closeModal(); showToast('App lock turned off'); render();
      return;
    }
    const np = document.getElementById('f-new-pin').value;
    const cp = document.getElementById('f-confirm-pin').value;
    if (!/^\d{4}$/.test(np)) { showToast('PIN must be exactly 4 digits', 'error'); return; }
    if (np !== cp) { showToast('PINs do not match', 'error'); return; }
    const salt = bufToBase64(crypto.getRandomValues(new Uint8Array(16)).buffer);
    const hash = await hashPin(np, salt);
    state.settings.security.enabled = true;
    state.settings.security.salt = salt;
    state.settings.security.passwordHash = hash;
    persist('settings'); closeModal(); showToast(mode === 'enable' ? 'App lock enabled' : 'PIN updated'); render();
    if (mode === 'enable' && !backGuardArmed) armBackGuard(); // so the back button locks immediately, without needing a reload
  });
}

/* ---- init ---- */
function hideLoadingOverlay() {
  const el = document.getElementById('app-loading');
  if (el) el.classList.add('hide');
}
if (state.settings.security.enabled) { showLockScreen(); } else { applyTheme(); bootApp(); }
// Give the very first paint a beat to settle before removing the splash, so it doesn't flash away
// instantly on fast devices (which reads as a jarring flicker rather than a smooth handoff).
requestAnimationFrame(() => requestAnimationFrame(hideLoadingOverlay));

</script>
</body>
</html>
