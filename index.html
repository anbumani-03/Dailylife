<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DailyLife – Personal Life Manager</title>
<meta name="theme-color" content="#0E7C66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DailyLife">
<link id="manifest-link" rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" id="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#FAF8F4;
  --surface:#FFFFFF;
  --surface-2:#F3F0E9;
  --ink:#232323;
  --muted:#6B7280;
  --border:#E7E3DA;
  --primary:#0E7C66;
  --primary-ink:#FFFFFF;
  --primary-light:#E4F3EF;
  --accent:#E8A33D;
  --accent-light:#FBF0DD;
  --danger:#D64545;
  --danger-light:#FBE7E7;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(35,35,35,0.04), 0 8px 24px -12px rgba(35,35,35,0.10);
  --font-display:'Manrope',sans-serif;
  --font-body:'Inter',sans-serif;
}
[data-theme="dark"]{
  --bg:#14171A;
  --surface:#1C2024;
  --surface-2:#22262B;
  --ink:#EDEDEC;
  --muted:#9AA1A9;
  --border:#2B3036;
  --primary:#22B8A0;
  --primary-ink:#0C1210;
  --primary-light:#1B3833;
  --accent:#F0B95A;
  --accent-light:#3A2E17;
  --danger:#F17272;
  --danger-light:#3A1F1F;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease, color .2s ease;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--primary-light); color:var(--primary);}

/* ===== Layout ===== */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px 10px;}
.brand-mark{
  width:34px; height:34px; border-radius:10px; background:var(--primary); color:var(--primary-ink);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:16px;
}
.brand-name{font-family:var(--font-display); font-weight:800; font-size:16.5px;}
.brand-sub{font-size:11px; color:var(--muted); margin-top:1px;}
.nav-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--muted); cursor:pointer; font-size:14px; font-weight:600; transition:background .15s, color .15s;
  user-select:none;
}
.nav-item .ic{font-size:16px; width:20px; text-align:center;}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--primary-light); color:var(--primary);}
.sidebar-footer{padding-top:10px; border-top:1px solid var(--border); margin-top:8px;}
.theme-toggle{
  display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:var(--radius-sm);
  font-size:13px; font-weight:600; color:var(--muted); cursor:pointer;
}
.switch{width:38px; height:22px; border-radius:20px; background:var(--surface-2); position:relative; border:1px solid var(--border); flex-shrink:0;}
.switch::after{content:'';position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--muted); transition:transform .18s ease, background .18s ease;}
[data-theme="dark"] .switch::after{transform:translateX(16px); background:var(--primary);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:none; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--surface);
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
}
.hamburger{background:none; border:none; font-size:20px; color:var(--ink); cursor:pointer; padding:4px;}
.page-content{padding:22px 26px 120px 26px; max-width:1180px; width:100%; margin:0 auto;}

.profile-avatar-btn{
  width:32px; height:32px; border-radius:50%; background:var(--primary); color:var(--primary-ink); border:none;
  font-size:14px; font-weight:800; font-family:var(--font-display); display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; transition:transform .12s ease;
}
.profile-avatar-btn:active{transform:scale(.92);}
.profile-avatar-btn.active{box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--primary);}
.desktop-topbar{display:none;}
@media (min-width:861px){
  .desktop-topbar{
    display:flex; justify-content:flex-end; align-items:center; padding:14px 26px 0 26px; max-width:1180px; width:100%; margin:0 auto;
  }
  .desktop-topbar .profile-avatar-btn{width:36px; height:36px; font-size:14px; box-shadow:var(--shadow);}
}

/* Bottom nav (mobile) */
.bottom-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
  z-index:30; padding:6px 2px calc(6px + env(safe-area-inset-bottom)) 2px;
}
.bottom-nav-scroll{display:flex; overflow-x:auto; gap:2px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
.bottom-nav-scroll::-webkit-scrollbar{display:none;}
.bn-item{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 12px;
  color:var(--muted); font-size:10px; font-weight:700; cursor:pointer; min-width:54px; border-radius:10px;
}
.bn-item .ic{font-size:18px;}
.bn-item.active{color:var(--primary); background:var(--primary-light);}
.fab-btn{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom));
  width:56px; height:56px; border-radius:50%; background:var(--primary); color:var(--primary-ink); border:4px solid var(--bg);
  font-size:26px; font-weight:800; display:none; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 8px 20px -6px rgba(14,124,102,0.5); transition:transform .12s ease; z-index:40;
}
.fab-btn:active{transform:translateX(-50%) scale(.92);}
.fab-btn.hidden{display:none !important;}
.fab-desktop{
  display:none; position:fixed; right:26px; bottom:26px; width:56px; height:56px; border-radius:50%;
  background:var(--primary); color:var(--primary-ink); border:none; font-size:26px; font-weight:800; cursor:pointer;
  box-shadow:0 8px 20px -6px rgba(14,124,102,0.5); z-index:40; align-items:center; justify-content:center;
}
@media (min-width:861px){ .fab-desktop{display:flex;} }
.fab-desktop.hidden{display:none !important;}

@media (max-width: 860px){
  .sidebar{display:none;}
  .sidebar.open{
    display:flex; position:fixed; z-index:50; left:0; top:0; height:100vh; box-shadow:var(--shadow);
    animation:slideIn .18s ease;
  }
  @keyframes slideIn{from{transform:translateX(-100%);} to{transform:translateX(0);}}
  .scrim{display:none;}
  .scrim.show{display:block; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:45;}
  .topbar{display:flex;}
  .bottom-nav{display:block;}
  .fab-btn{display:flex;}
  .page-content{padding:16px 14px 168px 14px;}
}

/* ===== Cards / grid ===== */
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media (max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px;
  box-shadow:var(--shadow);
}
.card-title{font-size:13px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
.stat-value{font-family:var(--font-display); font-size:28px; font-weight:800;}
.stat-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}

.page-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; flex-wrap:wrap;}
.page-header h2{font-size:22px; font-weight:800;}
.page-header .sub{color:var(--muted); font-size:13px; margin-top:2px;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex; align-items:center; gap:6px; border:none; border-radius:999px; padding:9px 16px;
  font-size:13.5px; font-weight:700; cursor:pointer; transition:transform .1s ease, opacity .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary); color:var(--primary-ink);}
.btn-secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--border);}
.btn-danger{background:var(--danger-light); color:var(--danger);}
.btn-ghost{background:transparent; color:var(--muted);}
.btn-icon{width:32px; height:32px; padding:0; justify-content:center; border-radius:9px; background:var(--surface-2); color:var(--muted); border:1px solid var(--border);}
.btn-icon:hover{color:var(--ink);}
.btn-sm{padding:6px 12px; font-size:12.5px;}

/* ===== Forms ===== */
.field{margin-bottom:13px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary); outline-offset:-1px;}
.field textarea{resize:vertical; min-height:70px;}
.field-row{display:flex; gap:10px;}
.field-row > .field{flex:1;}

/* ===== List rows ===== */
.list{display:flex; flex-direction:column; gap:8px;}
.row{
  display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:13px 14px;
}
.row-check{
  width:21px; height:21px; border-radius:7px; border:2px solid var(--border); flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; transition:.15s;
}
.row-check.checked{background:var(--primary); border-color:var(--primary);}
.row-main{flex:1; min-width:0;}
.row-title{font-weight:700; font-size:14.5px;}
.row-title.done{text-decoration:line-through; color:var(--muted);}
.row-meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.row-actions{display:flex; gap:6px; flex-shrink:0;}

.pill{display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.pill-low{background:var(--primary-light); color:var(--primary);}
.pill-medium{background:var(--accent-light); color:var(--accent);}
.pill-high{background:var(--danger-light); color:var(--danger);}

.tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:7px 14px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;}
.tab.active{background:var(--primary); color:var(--primary-ink); border-color:var(--primary);}

.searchbar{position:relative; margin-bottom:16px;}
.searchbar input{width:100%; padding:10px 14px 10px 36px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:14px; color:var(--ink);}
.searchbar .ic{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px;}

.empty-state{text-align:center; padding:44px 18px; color:var(--muted);}
.empty-state .ic{font-size:36px; margin-bottom:10px;}
.empty-state .msg{font-weight:700; color:var(--ink); margin-bottom:4px;}
.empty-state .hint{font-size:13px;}

/* ===== Modal ===== */
#modal-root{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:16px;}
#modal-root.show{display:flex;}
.modal-backdrop{position:absolute; inset:0; background:rgba(20,18,14,.45); animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal-sheet{
  position:relative; background:var(--surface); width:100%; max-width:440px; border-radius:20px;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom)) 20px; max-height:88vh; overflow-y:auto;
  animation:modalPop .16s ease;
}
@keyframes modalPop{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h3{font-size:17px; font-weight:800;}
.modal-actions{display:flex; gap:8px; margin-top:16px;}
.modal-actions .btn{flex:1; justify-content:center;}

/* ===== Toasts ===== */
#toast-root{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; pointer-events:none;}
@media (max-width:860px){#toast-root{bottom:78px;}}
.toast{
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
  box-shadow:var(--shadow); animation:toastIn .18s ease; pointer-events:auto; display:flex; align-items:center; gap:8px;
}
[data-theme="dark"] .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--border);}
.toast.error{background:var(--danger); color:#fff;}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* misc */
.chip-dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}
.section-title{font-size:15px; font-weight:800; margin:22px 0 10px 0;}
.section-title:first-child{margin-top:0;}
.progress-track{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
.progress-fill{height:100%; background:var(--primary); border-radius:999px; transition:width .3s ease;}
.chart-wrap{position:relative; height:200px;}
.note-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:8px; cursor:pointer; position:relative;}
.note-card.pinned{border-color:var(--accent);}
.pin-badge{position:absolute; top:10px; right:10px; color:var(--accent); font-size:14px;}
.note-title{font-weight:800; font-size:14.5px;}
.note-body{font-size:12.5px; color:var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;}
.note-date{font-size:11px; color:var(--muted);}
.alert-banner{display:flex; gap:10px; align-items:flex-start; background:var(--danger-light); color:var(--danger); border-radius:var(--radius-sm); padding:11px 13px; font-size:12.5px; font-weight:600; margin-bottom:10px;}
.alert-banner.warn{background:var(--accent-light); color:#8A5A0E;}
[data-theme="dark"] .alert-banner.warn{color:var(--accent);}

/* ===== Lock screen ===== */
#lock-screen{
  position:fixed; inset:0; z-index:500; background:var(--bg); display:none; flex-direction:column;
  align-items:center; justify-content:center; padding:24px; text-align:center;
}
#lock-screen.show{display:flex;}
.lock-mark{width:64px; height:64px; border-radius:18px; background:var(--primary); color:var(--primary-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:24px; margin-bottom:18px;}
.lock-title{font-family:var(--font-display); font-weight:800; font-size:19px; margin-bottom:4px;}
.lock-sub{color:var(--muted); font-size:13px; margin-bottom:22px;}
.pin-dots{display:flex; gap:12px; margin-bottom:20px;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--border); transition:background .1s, border-color .1s;}
.pin-dot.filled{background:var(--primary); border-color:var(--primary);}
.pin-dot.err{background:var(--danger); border-color:var(--danger);}
.lock-pad{display:grid; grid-template-columns:repeat(3,64px); gap:12px; margin-bottom:14px;}
.lock-key{
  width:64px; height:64px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  font-size:20px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.lock-key:active{background:var(--surface-2);}
.lock-key.wide{font-size:13px;}

/* Transaction (income/expense) modal: type toggle + numeric amount pad */
.tx-type-toggle{display:flex; gap:8px; margin-bottom:16px;}
.tx-type-btn{
  flex:1; padding:10px 8px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface);
  color:var(--muted); font-weight:700; font-size:13.5px; cursor:pointer; transition:.15s;
}
.tx-type-btn.expense.active{background:var(--danger-light); color:var(--danger); border-color:var(--danger);}
.tx-type-btn.income.active{background:var(--primary-light); color:var(--primary); border-color:var(--primary);}
.amount-display{
  text-align:center; font-family:var(--font-display); font-size:34px; font-weight:800; padding:14px 0 6px 0;
  color:var(--ink); letter-spacing:-0.01em; flex:1;
}
.amount-display-row{display:flex; align-items:center; justify-content:center; position:relative;}
.amount-clear-btn{
  position:absolute; right:0; top:50%; transform:translateY(-50%); background:none; border:none;
  color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; padding:6px 8px;
}
.amount-clear-btn:active{color:var(--danger);}
.amount-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 auto 18px auto; max-width:280px;}
.amount-key{
  padding:14px 0; border-radius:12px; border:none; background:var(--surface-2); color:var(--ink);
  font-size:19px; font-weight:700; cursor:pointer; transition:.1s;
}
.amount-key:active{background:var(--border);}
.amount-key.wide{font-size:15px; color:var(--muted);}

/* Profile avatar (large, used on Profile page + edit modal) and emoji picker */
.avatar-lg{
  width:64px; height:64px; border-radius:50%; background:var(--primary); color:var(--primary-ink);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px;
  font-family:var(--font-display); flex-shrink:0;
}
.emoji-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
.emoji-opt{
  font-size:22px; padding:10px 0; border-radius:12px; border:2px solid transparent; background:var(--surface-2);
  cursor:pointer; transition:.12s;
}
.emoji-opt:active{transform:scale(.9);}
.emoji-opt.selected{border-color:var(--primary); background:var(--primary-light);}
.profile-avatar-btn.emoji-mode{background:var(--surface-2);}
.avatar-lg.emoji-mode{background:var(--surface-2);}

/* Install banner: shown as a normal-flow element at the top of <body>, not position:fixed,
   so it pushes the sidebar/topbar/content down instead of overlapping anything. */
.install-banner{
  display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface);
  border-bottom:1px solid var(--border); box-shadow:var(--shadow); position:relative; z-index:20;
  animation:fadeIn .2s ease;
}
.install-banner-icon{
  width:34px; height:34px; border-radius:9px; background:var(--primary); color:var(--primary-ink);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-display);
  font-size:13px; flex-shrink:0;
}
.install-banner-text{flex:1; min-width:0;}
.install-banner-title{font-weight:800; font-size:13.5px;}
.install-banner-sub{font-size:11.5px; color:var(--muted);}
.lock-error{color:var(--danger); font-size:12.5px; font-weight:600; height:16px; margin-bottom:6px;}
.lock-bio{margin-top:6px;}
</style>
</head>
<body>
<div id="lock-screen">
  <div class="lock-mark">DL</div>
  <div class="lock-title">DailyLife is locked</div>
  <div class="lock-sub" id="lock-sub">Enter your PIN to continue</div>
  <div class="pin-dots" id="pin-dots"></div>
  <div class="lock-error" id="lock-error"></div>
  <div class="lock-pad" id="lock-pad"></div>
</div>
<div id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">DL</div>
      <div>
        <div class="brand-name">DailyLife</div>
        <div class="brand-sub">Personal manager</div>
      </div>
    </div>

function loadFromStorage(key, fallback) {
  try {

    console.error('loadFromStorage failed for', key, e);
    return fallback;
  }
}
function saveToStorage(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify(data));

  } catch (e) {

function updateStorage(key, data) { return saveToStorage(key, data); }
function deleteFromStorage(key) {

function toLocalDateStr(d) {
  const y = d.getFullYear();

  return `${y}-${m}-${day}`;
}

function esc(str) {

  return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtMoney(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
/* jsPDF's built-in fonts don't reliably render the ₹ glyph (it can show as a blank box),
   so PDF reports use "Rs" instead of the symbol. */
function fmtMoneyPDF(n) { return 'Rs ' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function daysBetween(iso) {
  const d = new Date(iso + 'T00:00:00');
  const t = new Date(todayISO() + 'T00:00:00');
  return Math.round((d - t) / 86400000);
}
function sum(arr) { return arr.reduce((s, e) => s + Number(e.amount || 0), 0); }
function emptyState(icon, msg, hint) {

}
function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function toCSV(rows) {
  return rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
}
function downloadPDFReport(title, headers, rows, filename, summaryLines) {
  try {
    const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDFCtor) { showToast('PDF library did not load — check your connection', 'error'); return; }
    const doc = new jsPDFCtor();
    doc.setFontSize(16);
    doc.setTextColor(20);
    doc.text(title, 14, 18);
    doc.setFontSize(9.5);
    doc.setTextColor(120);
    doc.text('Generated ' + new Date().toLocaleString(), 14, 24);
    let startY = 30;
    if (summaryLines && summaryLines.length) {
      doc.setFontSize(11);
      doc.setTextColor(30);
      summaryLines.forEach((line, i) => doc.text(line, 14, startY + i * 6));
      startY += summaryLines.length * 6 + 6;
    }
    doc.autoTable({
      head: [headers], body: rows, startY,
      styles: { fontSize: 9, cellPadding: 3 },
      headStyles: { fillColor: [14, 124, 102], textColor: 255 },
      alternateRowStyles: { fillColor: [246, 244, 239] },
    });
    doc.save(filename);
    showToast('PDF downloaded');
  } catch (e) {
    console.error('PDF generation failed', e);
    showToast('PDF generation failed', 'error');
  }
}

/* ===================== Security: PIN lock + optional biometric ===================== */
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPin(pin, salt) { return sha256Hex(salt + ':' + pin); }

let appUnlocked = !state.settings.security.enabled;
let pinBuffer = '';

function buildLockPad() {
  const pad = document.getElementById('lock-pad');
  const keys = ['1','2','3','4','5','6','7','8','9','bio','0','del'];
  pad.innerHTML = keys.map(k => {
    if (k === 'bio') return `<button class="lock-key wide" id="lock-key-bio">🔐</button>`;
    if (k === 'del') return `<button class="lock-key wide" id="lock-key-del">⌫</button>`;
    return `<button class="lock-key" data-digit="${k}">${k}</button>`;
  }).join('');
  pad.querySelectorAll('[data-digit]').forEach(btn => btn.addEventListener('click', () => onPinDigit(btn.dataset.digit)));
  document.getElementById('lock-key-del').addEventListener('click', () => { pinBuffer = pinBuffer.slice(0, -1); renderPinDots(); });
  const bioBtn = document.getElementById('lock-key-bio');
  if (state.settings.security.biometricEnabled && state.settings.security.credentialId) {
    bioBtn.style.visibility = 'visible';
    bioBtn.addEventListener('click', attemptBiometricUnlock);
  } else {
    bioBtn.style.visibility = 'hidden';
  }
}
function renderPinDots(err) {
  const dots = document.getElementById('pin-dots');
  dots.innerHTML = [0,1,2,3].map(i => `<div class="pin-dot ${i < pinBuffer.length ? 'filled' : ''} ${err ? 'err' : ''}"></div>`).join('');
}
async function onPinDigit(d) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += d;
  renderPinDots();
  if (pinBuffer.length === 4) {
    const hash = await hashPin(pinBuffer, state.settings.security.salt);
    if (hash === state.settings.security.passwordHash) {
      unlockApp();
    } else {
      renderPinDots(true);
      document.getElementById('lock-error').textContent = 'Incorrect PIN, try again';
      setTimeout(() => { pinBuffer = ''; renderPinDots(); document.getElementById('lock-error').textContent = ''; }, 500);
    }
  }
}
function unlockApp() {
  appUnlocked = true;
  pinBuffer = '';
  document.getElementById('lock-screen').classList.remove('show');
  armBackGuard();
  bootApp();
}
function showLockScreen() {
  pinBuffer = '';
  renderPinDots();
  document.getElementById('lock-error').textContent = '';
  buildLockPad();
  document.getElementById('lock-screen').classList.add('show');
}
async function attemptBiometricUnlock() {
  try {
    if (!window.PublicKeyCredential) throw new Error('unsupported');
    const credId = base64ToBuf(state.settings.security.credentialId);
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({
      publicKey: { challenge, allowCredentials: [{ id: credId, type: 'public-key' }], userVerification: 'required', timeout: 30000 }
    });
    unlockApp();
  } catch (e) {
    document.getElementById('lock-error').textContent = 'Biometric unlock failed — use your PIN';
  }
}

/* ===================== Back button: lock instead of navigating tab history, then exit on the next press =====================
   Tab switches never touch browser history (see navigateTo), so without this, pressing the phone's
   physical back button would just leave the app immediately. Instead: while the app is unlocked, the
   first back press locks it (and re-arms this guard); if the app is already locked, the next back press
   is left alone and falls through to the browser's normal behavior, which closes/exits the app. */
let backGuardArmed = false;
function armBackGuard() {
  try { history.pushState({ dlGuard: true }, ''); backGuardArmed = true; } catch (e) { /* ignore */ }
}
function lockAppNow() {
  if (!state.settings.security.enabled || !appUnlocked) return;
  appUnlocked = false;
  pinBuffer = '';
  saveUIState();
  showLockScreen();
}
window.addEventListener('popstate', () => {
  if (state.settings.security.enabled && appUnlocked) {
    lockAppNow();
    // Intentionally not re-armed here — the very next back press should exit the app, not lock it again.
  }
  // If already locked (or lock isn't enabled), do nothing: let the browser's default back action proceed.
});

/* ===================== Auto-lock after a period of inactivity ===================== */
const AUTO_LOCK_MS = 60 * 1000;
let lastActivityAt = Date.now();
function markActivity() { lastActivityAt = Date.now(); }
['click', 'keydown', 'touchstart', 'mousemove', 'scroll', 'wheel'].forEach(evt => {
  document.addEventListener(evt, markActivity, { passive: true });
});
setInterval(() => {
  if (state.settings.security.enabled && appUnlocked && Date.now() - lastActivityAt >= AUTO_LOCK_MS) {
    lockAppNow();
  }
}, 5000);
function bufToBase64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function utf8ToBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
function base64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer; }
async function registerBiometric() {
  if (!window.PublicKeyCredential) { showToast('Biometric unlock is not supported on this device', 'error'); return false; }
  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'DailyLife' },
        user: { id: userId, name: state.settings.profile.name || 'DailyLife user', displayName: state.settings.profile.name || 'DailyLife user' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 30000,
      }
    });
    state.settings.security.credentialId = bufToBase64(cred.rawId);
    state.settings.security.biometricEnabled = true;
    persist('settings');
    return true;
  } catch (e) {
    showToast('Could not set up fingerprint / Face ID unlock', 'error');
    return false;
  }
}

/* ===================== Service worker (needed for mobile notifications + installability) ===================== */
let swRegistration = null;
function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return Promise.resolve(null);
  return navigator.serviceWorker.register('./sw.js')
    .then(reg => { swRegistration = reg; return reg; })
    .catch(() => { swRegistration = null; return null; }); // e.g. opened via file:// — silently degrade to desktop-only notifications
}
registerServiceWorker();

/* ===================== Notifications for due bills & reminders ===================== */
function notificationsSupported() {
  return typeof Notification !== 'undefined';
}
async function showAppNotification(title, options) {
  // Android/Chrome mobile requires notifications to go through a service worker registration;
  // the plain `new Notification()` constructor throws there. Desktop browsers support both,
  // so we prefer the service worker path whenever one is registered and fall back otherwise.
  try {
    const reg = swRegistration || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
    if (reg && reg.showNotification) {
      await reg.showNotification(title, { icon: 'data:,', badge: 'data:,', ...options });
      return true;
    }
  } catch (e) { /* fall through to direct Notification */ }
  try {
    new Notification(title, options);
    return true;
  } catch (e) {
    return false;
  }
}
function checkDueNotifications() {
  if (!state.settings.notifications.enabled || !notificationsSupported() || Notification.permission !== 'granted') return;
  const notified = new Set(state.settings.notifications.notifiedIds);
  let changed = false;
  state.reminders.forEach(r => {
    const key = 'rem_' + r.id + '_' + r.date;
    if (!notified.has(key) && daysBetween(r.date) === 0) {
      showAppNotification('Reminder: ' + r.title, { body: r.description || ('Due today' + (r.time ? ' at ' + r.time : '')) });
      notified.add(key); changed = true;
    }
  });
  state.bills.forEach(b => {
    const key = 'bill_' + b.id + '_' + b.dueDate;
    if (b.status !== 'Paid' && !notified.has(key) && daysBetween(b.dueDate) >= 0 && daysBetween(b.dueDate) <= 1) {
      showAppNotification('Bill due: ' + b.name, { body: fmtMoney(b.amount) + ' due ' + fmtDate(b.dueDate) });
      notified.add(key); changed = true;
    }
  });
  if (changed) { state.settings.notifications.notifiedIds = Array.from(notified).slice(-200); persist('settings'); }
}
function enableNotifications() {
  if (!notificationsSupported()) { showToast('Notifications are not supported on this device', 'error'); return; }
  registerServiceWorker().finally(() => {
    Notification.requestPermission().then(perm => {
      state.settings.notifications.enabled = perm === 'granted';
      persist('settings');
      if (perm === 'granted') { showToast('Notifications enabled'); checkDueNotifications(); }
      else showToast('Notification permission was not granted', 'error');
      render();
    });
  });
}
function disableNotifications() { state.settings.notifications.enabled = false; persist('settings'); render(); }
async function sendTestNotification() {
  if (!notificationsSupported()) { showToast('Notifications are not supported on this device', 'error'); return; }
  if (Notification.permission !== 'granted') { showToast('Enable notifications first', 'error'); return; }
  const ok = await showAppNotification('DailyLife', { body: 'Notifications are working on this device 🎉' });
  showToast(ok ? 'Test notification sent' : 'Could not send a notification on this device', ok ? 'success' : 'error');
}
setInterval(checkDueNotifications, 5 * 60 * 1000);

/* ===================== Export / Import ===================== */
function exportData() {
  const payload = {};
  Object.keys(STORAGE_KEYS).forEach(k => payload[k] = state[k]);
  payload._exportedAt = new Date().toISOString();
  payload._app = 'DailyLife';
  downloadBlob(`dailylife-backup-${todayISO()}.json`, JSON.stringify(payload, null, 2), 'application/json');
  showToast('Backup file downloaded');
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      Object.keys(STORAGE_KEYS).forEach(k => {
        if (k === 'settings') {
          state.settings = mergeDefaults(data.settings || {}, DEFAULT_SETTINGS);
        } else if (Array.isArray(data[k])) {
          state[k] = data[k];
        }
        persist(k);
      });
      state.planner.forEach(p => { if (!p.date) p.date = todayISO(); });
      showToast('Data imported successfully');
      closeModal();
      render();
    } catch (e) {
      showToast('That file could not be read as a DailyLife backup', 'error');
    }
  };
  reader.readAsText(file);
}

/* ---------- Router ---------- */
window.addEventListener('hashchange', () => {
  const r = (location.hash || '#/dashboard').replace('#/', '');
  currentRoute = ROUTES.some(x => x.id === r) ? r : 'dashboard';
  render();
});

let chartRefs = {}; // track Chart.js instances so we can destroy before re-render
function destroyCharts() {
  Object.values(chartRefs).forEach(c => c && c.destroy());
  chartRefs = {};
}

let lastRenderedRoute = null;
function render() {
  if (state.settings.security.enabled && !appUnlocked) { showLockScreen(); return; }
  // Capture scroll position before touching the DOM. Re-rendering happens for lots of reasons that
  // AREN'T "the user navigated to a new page" — ticking a checkbox, switching a filter tab (e.g.
  // Pending/Completed), saving an edit, etc. Only an actual route change should jump to the top;
  // everything else should leave the user right where they were scrolled to.
  const preservedScrollY = window.scrollY || 0;
  const routeChanged = currentRoute !== lastRenderedRoute;
  applyTheme();
  renderNav();
  destroyCharts();
  const el = document.getElementById('page-content');
  switch (currentRoute) {
    case 'dashboard': el.innerHTML = renderDashboard(); afterRenderDashboard(); break;
    case 'tasks': el.innerHTML = renderTasksPage(); afterRenderTasks(); break;
    case 'planner': el.innerHTML = renderPlannerPage(); afterRenderPlanner(); break;
    case 'expenses': el.innerHTML = renderFinancePage(); afterRenderFinance(); break;
    case 'shopping': el.innerHTML = renderShoppingPage(); afterRenderShopping(); break;
    case 'reminders': el.innerHTML = renderRemindersPage(); afterRenderReminders(); break;
    case 'links': el.innerHTML = renderLinksPage(); afterRenderLinks(); break;
    case 'notes': el.innerHTML = renderNotesPage(); afterRenderNotes(); break;
    case 'bills': el.innerHTML = renderBillsPage(); afterRenderBills(); break;
    case 'documents': el.innerHTML = renderDocumentsPage(); afterRenderDocuments(); break;
    case 'profile': el.innerHTML = renderProfilePage(); afterRenderProfile(); break;
    default: el.innerHTML = '';
  }
  if (skipNextScrollReset) { skipNextScrollReset = false; }
  else if (routeChanged) { window.scrollTo(0, 0); }
  else { window.scrollTo(0, preservedScrollY); }
  lastRenderedRoute = currentRoute;
  saveUIState();
}

/* Boot (or re-boot after unlocking): restores the last-viewed section and scroll position instead of
   always landing on the Dashboard at the top of the page. */
let skipNextScrollReset = false;
function bootApp() {
  const saved = loadUIState();
  let restoreScrollY = null;
  if (saved && ROUTES.some(r => r.id === saved.route)) {
    currentRoute = saved.route;
    try { history.replaceState(null, '', '#/' + currentRoute); } catch (e) { /* ignore */ }
    restoreScrollY = saved.scrollY;
  }
  skipNextScrollReset = true;
  render();
  if (typeof restoreScrollY === 'number' && restoreScrollY > 0) {
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, restoreScrollY)));
  }
  checkDueNotifications();
  setTimeout(showInstallBanner, 2000);
}
let scrollSaveTimer = null;
window.addEventListener('scroll', () => {
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(saveUIState, 200);
}, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveUIState(); });

/* Manifest and icons are now real static files (manifest.json, icon-*.png, apple-touch-icon.png)
   linked directly in index.html's <head>, not injected at runtime. A manifest swapped in via
   JavaScript after page load (or a data: URI manifest) is unreliable for Chrome's installability
   checks — it commonly results in "Add to Home Screen" creating a plain browser shortcut instead
   of a real installable PWA, which is exactly the bug this replaced. */

function renderTaskListOnly() {

const PLANNER_SLOTS = ['Morning', 'Afternoon', 'Evening'];
function shiftPlannerDate(days) {
  const d = new Date(plannerDate + 'T00:00:00');
  d.setDate(d.getDate() + days);
  plannerDate = toLocalDateStr(d);
  render();
}
function renderPlannerPage() {
  const dayItems = state.planner.filter(p => p.date === plannerDate);
  const grouped = {}; PLANNER_SLOTS.forEach(s => grouped[s] = []);
  const customs = [];
  dayItems.forEach(p => { if (PLANNER_SLOTS.includes(p.slot)) grouped[p.slot].push(p); else customs.push(p); });
  const total = dayItems.length, done = dayItems.filter(p => p.completed).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  const slotBlock = (label, items) => `
    <div class="section-title">${label}</div>
    <div class="list">${items.length ? items.map(plannerRow).join('') : emptyState('☀️','Nothing planned','Add an activity for this slot')}</div>

  let customHtml = '';
  if (customs.length) {
    const byName = {}; customs.forEach(c => { (byName[c.slot] = byName[c.slot] || []).push(c); });
    customHtml = Object.entries(byName).map(([name, items]) => slotBlock(name, items)).join('');
  }
  const isToday = plannerDate === todayISO();
  return `
    <div class="page-header">
      <div><h2>Daily Planner</h2><div class="sub">Plan any day — dates are continuous, so you can move freely</div></div>

function downloadFinanceMonthlyReport() {

}

let txModalType = 'expense';
let txAmountBuffer = ''; // plain typed string, e.g. "1234.5" — integer digits first, decimal point after
function txBufferToAmount() {
  if (!txAmountBuffer || txAmountBuffer === '.') return 0;
  const n = parseFloat(txAmountBuffer);
  return isNaN(n) ? 0 : n;
}
function updateAmountDisplay() {
  const el = document.getElementById('tx-amount-display');
  if (el) el.textContent = '₹' + (txAmountBuffer || '0');
}
function pressAmountKey(k) {
  if (k === '.') {
    if (txAmountBuffer.includes('.')) return; // only one decimal point
    txAmountBuffer = (txAmountBuffer === '' ? '0' : txAmountBuffer) + '.';
  } else {
    const dotIndex = txAmountBuffer.indexOf('.');
    if (dotIndex !== -1 && txAmountBuffer.length - dotIndex - 1 >= 2) return; // max 2 decimal places
    const intDigits = (dotIndex === -1 ? txAmountBuffer : txAmountBuffer.slice(0, dotIndex)).length;
    if (dotIndex === -1 && intDigits >= 9) return; // sane cap on whole-number length
    if (txAmountBuffer === '0') txAmountBuffer = k; // replace a lone leading zero
    else txAmountBuffer += k;
  }
  updateAmountDisplay();
}
function buildAmountPad() {
  const pad = document.getElementById('tx-amount-pad');
  const keys = ['1','2','3','4','5','6','7','8','9','.','0','del'];
  pad.innerHTML = keys.map(k => {
    if (k === 'del') return `<button type="button" class="amount-key wide" id="amt-key-del">⌫</button>`;
    return `<button type="button" class="amount-key" data-digit="${k}">${k}</button>`;
  }).join('');
  pad.querySelectorAll('[data-digit]').forEach(btn => btn.addEventListener('click', () => pressAmountKey(btn.dataset.digit)));
  document.getElementById('amt-key-del').addEventListener('click', () => { txAmountBuffer = txAmountBuffer.slice(0, -1); updateAmountDisplay(); });
  document.getElementById('tx-amount-clear').addEventListener('click', () => { txAmountBuffer = ''; updateAmountDisplay(); });
}
function populateCategorySelect(item) {
  const sel = document.getElementById('f-category');
  if (!sel) return;
  const cats = txModalType === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  sel.innerHTML = cats.map(c => `<option ${item && item.category === c.name ? 'selected' : ''}>${c.name}</option>`).join('');
}
function openTransactionModal(initialType, item) {
  const editing = !!item;
  txModalType = editing ? (state.income.includes(item) ? 'income' : 'expense') : initialType;
  txAmountBuffer = item ? String(Number(item.amount)) : '';
  openModal(`
    <div class="modal-head"><h3 id="tx-modal-title">${editing ? 'Edit' : 'Add'} ${txModalType === 'income' ? 'income' : 'expense'}</h3><button class="btn-icon" id="modal-close">✕</button></div>
    <div class="tx-type-toggle" id="tx-type-toggle">
      <button type="button" class="tx-type-btn expense ${txModalType==='expense'?'active':''}" data-type="expense">💸 Expense</button>
      <button type="button" class="tx-type-btn income ${txModalType==='income'?'active':''}" data-type="income">💰 Income</button>
    </div>
    <div class="amount-display-row">
      <div class="amount-display" id="tx-amount-display">₹0</div>
      <button type="button" class="amount-clear-btn" id="tx-amount-clear">Clear</button>
    </div>
    <div class="amount-pad" id="tx-amount-pad"></div>
    <div class="field"><label>Category</label><select id="f-category"></select></div>
    <div class="field"><label>Payment method</label>
      <div class="tabs" id="tx-payment-toggle" style="margin-bottom:0;">
        <div class="tab ${(!item || item.paymentMethod !== 'UPI') ? 'active' : ''}" data-payment="Cash">💵 Cash</div>
        <div class="tab ${(item && item.paymentMethod === 'UPI') ? 'active' : ''}" data-payment="UPI">📱 UPI</div>
      </div>
    </div>
    <div class="field"><label>Description</label><input id="f-desc" autocomplete="off" value="${esc(item?.description||'')}" placeholder="e.g. Groceries"></div>
    <div class="field"><label>Date</label><input id="f-date" autocomplete="off" type="date" value="${item?.date||todayISO()}"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">${editing?'Save changes':'Add'}</button>
    </div>
  `);
  buildAmountPad();
  updateAmountDisplay();
  populateCategorySelect(item);
  document.querySelectorAll('#tx-payment-toggle .tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tx-payment-toggle .tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  document.querySelectorAll('#tx-type-toggle .tx-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      txModalType = btn.dataset.type;
      document.querySelectorAll('#tx-type-toggle .tx-type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === txModalType));
      document.getElementById('tx-modal-title').textContent = `${editing ? 'Edit' : 'Add'} ${txModalType === 'income' ? 'income' : 'expense'}`;
      populateCategorySelect(null);
    });
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', () => {
    const amount = txBufferToAmount();
    if (!amount || amount <= 0) { showToast('Please enter a valid amount', 'error'); return; }
    const paymentMethod = document.querySelector('#tx-payment-toggle .tab.active')?.dataset.payment || 'Cash';
    const data = { amount, category: document.getElementById('f-category').value, paymentMethod, description: document.getElementById('f-desc').value.trim(), date: document.getElementById('f-date').value || todayISO() };
    if (editing) {
      const wasIncome = state.income.includes(item);
      const wasType = wasIncome ? 'income' : 'expense';
      if (wasType !== txModalType) {
        if (wasIncome) state.income = state.income.filter(x => x !== item);
        else state.expenses = state.expenses.filter(x => x !== item);
        Object.assign(item, data);
        (txModalType === 'income' ? state.income : state.expenses).push(item);
        persist('income'); persist('expenses');
      } else {
        Object.assign(item, data);
        persist(txModalType === 'income' ? 'income' : 'expenses');
      }
      showToast((txModalType === 'income' ? 'Income' : 'Expense') + ' updated');
    } else {
      (txModalType === 'income' ? state.income : state.expenses).push({ id: uid(), ...data });
      persist(txModalType === 'income' ? 'income' : 'expenses');
      showToast((txModalType === 'income' ? 'Income' : 'Expense') + ' added');
    }
    closeModal(); render();
  });
}

function docRow(d) {

  return `

          ${d.expiryDate ? `<span style="color:${expired?'var(--danger)':soon?'var(--accent)':'var(--muted)'}">${expired?'Expired ':'Expires '}${fmtDate(d.expiryDate)}</span>` : '<span>No expiry</span>'}
        </div>
        ${d.notes ? `<div class="row-meta">${esc(d.notes)}</div>` : ''}
      </div>
      <div class="row-actions">
        <button class="btn-icon" data-action="edit">✎</button>

    row.querySelector('[data-action="edit"]').addEventListener('click', () => openDocModal(state.documents.find(x => x.id === id)));
    row.querySelector('[data-action="delete"]').addEventListener('click', () => {
      confirmDialog('Delete document?', 'This document record will be permanently removed.', () => {
        state.documents = state.documents.filter(x => x.id !== id); persist('documents'); render(); showToast('Document deleted');
      });
    });
  });
  if (state.documents.length) {
    const buckets = { Expired: 0, 'Expiring soon': 0, Valid: 0, 'No expiry': 0 };
    state.documents.forEach(d => {
      if (!d.expiryDate) buckets['No expiry']++;
      else { const n = daysBetween(d.expiryDate); if (n < 0) buckets.Expired++; else if (n <= 30) buckets['Expiring soon']++; else buckets.Valid++; }
    });
    chartRefs.doc = new Chart(document.getElementById('doc-chart'), {
      type: 'doughnut',
      data: { labels: Object.keys(buckets), datasets: [{ data: Object.values(buckets), backgroundColor: ['#D64545','#E8A33D','#0E7C66','#8A8578'], borderWidth: 0 }] },
      options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10 } } } }, maintainAspectRatio: false }
    });
  }
}
function openDocModal(item) {
  const editing = !!item;
  openModal(`
    <div class="modal-head"><h3>${editing?'Edit document':'Add document'}</h3><button class="btn-icon" id="modal-close">✕</button></div>
    <div class="field"><label>Document / product name</label><input id="f-name" autocomplete="off" value="${esc(item?.name||'')}" placeholder="e.g. Laptop warranty"></div>
    <div class="field"><label>Type</label><select id="f-type">${DOC_TYPES.map(t=>`<option ${item?.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Expiry date</label><input id="f-expiry" autocomplete="off" type="date" value="${item?.expiryDate||''}"></div>
    <div class="field"><label>Notes</label><textarea id="f-notes" autocomplete="off">${esc(item?.notes||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">${editing?'Save changes':'Add document'}</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { showToast('Please enter a name', 'error'); return; }
    const data = { name, type: document.getElementById('f-type').value, expiryDate: document.getElementById('f-expiry').value, notes: document.getElementById('f-notes').value.trim() };
    if (editing) { Object.assign(item, data); showToast('Document updated'); }
    else { state.documents.push({ id: uid(), ...data }); showToast('Document added'); }
    persist('documents'); closeModal(); render();
  });
}

/* ============================== DASHBOARD ============================== */
function greeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}
function renderDashboard() {
  const today = todayISO();

  const completedToday = todaysTasks.filter(t => t.completed).length;
  const pendingTasks = state.tasks.filter(t => !t.completed);
  const upcomingReminders = [...state.reminders].filter(r => daysBetween(r.date) >= 0).sort((a,b)=>a.date.localeCompare(b.date)).slice(0, 4);
  const todayExpenseTotal = sum(state.expenses.filter(e => e.date === today));
  const monthExpenseTotal = sum(state.expenses.filter(e => e.date.slice(0,7) === today.slice(0,7)));
  const monthIncomeTotal = sum(state.income.filter(e => e.date.slice(0,7) === today.slice(0,7)));
  const netMonth = monthIncomeTotal - monthExpenseTotal;
  const shoppingPending = state.shopping.filter(i => !i.purchased);
  const upcomingBills = [...state.bills].filter(b => b.status !== 'Paid').sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0, 4);
  const todaysPlan = state.planner.filter(p => p.date === today);
  const totalTasksToday = todaysTasks.length;
  const pct = totalTasksToday ? Math.round((completedToday / totalTasksToday) * 100) : 0;
  const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const name = state.settings.profile.name;

  return `
    <div class="page-header">
      <div><h2>${greeting()}${name ? ', ' + esc(name.split(' ')[0]) : ''} 👋</h2><div class="sub">${dateStr}</div></div>

    <div class="grid grid-4" style="margin-bottom:16px;">

        <div class="progress-track" style="margin-top:10px;"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="stat-sub">${pct}% complete</div>
      </div>
      <div class="card">
        <div class="card-title">Pending tasks</div>
        <div class="stat-value">${pendingTasks.length}</div>
        <div class="stat-sub">across all due dates</div>
      </div>
      <div class="card">
        <div class="card-title">Net this month</div>
        <div class="stat-value" style="color:${netMonth>=0?'var(--primary)':'var(--danger)'}">${netMonth>=0?'+':''}${fmtMoney(netMonth)}</div>
        <div class="stat-sub">${fmtMoney(todayExpenseTotal)} spent today</div>
      </div>
      <div class="card">
        <div class="card-title">Shopping list</div>
        <div class="stat-value">${shoppingPending.length}</div>
        <div class="stat-sub">items left to buy</div>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">Today's tasks</div>
        <div class="list">${todaysTasks.length ? todaysTasks.slice(0,5).map(t => `
          <div class="row" style="padding:10px 12px;">
            <div class="row-check ${t.completed?'checked':''}">${t.completed?'✓':''}</div>
            <div class="row-main"><div class="row-title ${t.completed?'done':''}" style="font-size:13.5px;">${esc(t.title)}</div></div>
            <span class="pill pill-${t.priority.toLowerCase()}">${t.priority}</span>
          </div>`).join('') : emptyState('✅','Nothing due today','Enjoy the free time, or plan ahead')}</div>
      </div>
      <div class="card">
        <div class="card-title">Upcoming reminders</div>
        <div class="list">${upcomingReminders.length ? upcomingReminders.map(r => `
          <div class="row" style="padding:10px 12px;">
            <div class="row-main"><div class="row-title" style="font-size:13.5px;">${esc(r.title)}</div><div class="row-meta">${fmtDate(r.date)}${r.time?' · '+r.time:''}</div></div>
            <span class="pill pill-${r.priority.toLowerCase()}">${r.priority}</span>
          </div>`).join('') : emptyState('🔔','No upcoming reminders','You are all caught up')}</div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:14px;">
      <div class="card">
        <div class="card-title">Monthly spending by category</div>
        <div class="chart-wrap"><canvas id="dash-pie"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Upcoming bills</div>
        <div class="list">${upcomingBills.length ? upcomingBills.map(b => `
          <div class="row" style="padding:10px 12px;">
            <div class="row-main"><div class="row-title" style="font-size:13.5px;">${esc(b.name)}</div><div class="row-meta">Due ${fmtDate(b.dueDate)}</div></div>

      <div class="card">
        <div class="card-title">Today's plan</div>
        <div class="list">${todaysPlan.length ? todaysPlan.slice(0,5).map(p => `
          <div class="row" style="padding:10px 12px;">
            <div class="row-check ${p.completed?'checked':''}">${p.completed?'✓':''}</div>
            <div class="row-main"><div class="row-title ${p.completed?'done':''}" style="font-size:13.5px;">${esc(p.activity)}</div><div class="row-meta">${esc(p.slot)}${p.time?' · '+p.time:''}</div></div>

function afterRenderDashboard() {
  const monthPrefix = todayISO().slice(0, 7);
  const byCat = {};
  state.expenses.filter(e => e.date.slice(0,7) === monthPrefix).forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + Number(e.amount || 0); });
  const labels = Object.keys(byCat);
  const canvas = document.getElementById('dash-pie');
  if (labels.length && canvas) {
    chartRefs.dashPie = new Chart(canvas, {
      type: 'doughnut',
      data: { labels, datasets: [{ data: labels.map(l => byCat[l]), backgroundColor: labels.map(l => catColor(EXPENSE_CATEGORIES, l)), borderWidth: 0 }] },
      options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10 } } } }, maintainAspectRatio: false }
    });
  } else if (canvas) {
    canvas.parentElement.innerHTML = emptyState('💰','No spending yet this month','Add an expense to see the breakdown');
  }
}

/* ============================== PROFILE & SETTINGS ============================== */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; showInstallBanner(); });

/* ===================== Install banner: nudges people opening this in a plain browser tab to install it ===================== */
let installBannerShown = false;
function isRunningStandalone() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function shouldOfferInstallBanner() {
  if (isRunningStandalone()) return false; // already installed/running as an app
  const dismissedAt = Number(localStorage.getItem('dailylife_install_dismissed_at') || 0);
  if (dismissedAt && Date.now() - dismissedAt < 7 * 24 * 60 * 60 * 1000) return false; // don't nag more than once a week
  return true;
}
function showInstallBanner() {
  if (installBannerShown || document.getElementById('install-banner') || !shouldOfferInstallBanner()) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (!deferredInstallPrompt && !isIOS) return; // nothing actionable to offer on this platform yet
  installBannerShown = true;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.className = 'install-banner';
  banner.innerHTML = `
    <div class="install-banner-icon">DL</div>
    <div class="install-banner-text">
      <div class="install-banner-title">Install DailyLife</div>
      <div class="install-banner-sub">${isIOS ? 'Tap the Share icon, then "Add to Home Screen"' : 'Add it to your home screen for the full app experience'}</div>
    </div>
    ${!isIOS ? '<button class="btn btn-primary btn-sm" id="install-banner-btn">Install</button>' : ''}
    <button class="btn-icon" id="install-banner-close">✕</button>
  `;
  document.body.insertBefore(banner, document.body.firstChild);
  document.getElementById('install-banner-close').addEventListener('click', dismissInstallBanner);
  const installBtn = document.getElementById('install-banner-btn');
  if (installBtn) installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) { dismissInstallBanner(); return; }
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    dismissInstallBanner();
  });
}
function dismissInstallBanner() {
  const el = document.getElementById('install-banner');
  if (el) el.remove();
  installBannerShown = false;
  try { localStorage.setItem('dailylife_install_dismissed_at', String(Date.now())); } catch (e) { /* ignore */ }
}

      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" id="export-btn">⬇ Export backup</button>
        <button class="btn btn-secondary btn-sm" id="import-btn">⬆ Import backup</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;">
      </div>

      <button class="btn btn-primary btn-sm" id="install-btn" style="display:none;">📲 Install app</button>
    </div>

    <div class="section-title">Appearance</div>
    <div class="card" style="display:flex; align-items:center; justify-content:space-between;">
      <div style="font-weight:700; font-size:14px;">Dark mode</div>
      <span class="switch" id="profile-theme-switch" style="cursor:pointer;"></span>
    </div>

    <div style="text-align:center; color:var(--muted); font-size:11.5px; margin-top:26px; padding-bottom:6px;">DailyLife v${APP_VERSION}</div>
  `;
}
function afterRenderProfile() {
  document.getElementById('edit-profile-btn').addEventListener('click', openProfileEditModal);
  document.getElementById('profile-avatar-lg').addEventListener('click', openEmojiPickerModal);
  document.getElementById('toggle-lock-btn').addEventListener('click', () => {
    openPinSetupModal(state.settings.security.enabled ? 'disable' : 'enable');
  });
  const changePinBtn = document.getElementById('change-pin-btn');
  if (changePinBtn) changePinBtn.addEventListener('click', () => openPinSetupModal('change'));
  const toggleBioBtn = document.getElementById('toggle-bio-btn');
  if (toggleBioBtn) toggleBioBtn.addEventListener('click', async () => {
    if (state.settings.security.biometricEnabled) {
      state.settings.security.biometricEnabled = false;
      state.settings.security.credentialId = null;
      persist('settings'); showToast('Biometric unlock disabled'); render();
    } else {
      const ok = await registerBiometric();
      if (ok) { showToast('Biometric unlock enabled'); render(); }
    }
  });
  document.getElementById('toggle-notif-btn').addEventListener('click', () => {
    state.settings.notifications.enabled ? disableNotifications() : enableNotifications();
  });
  const testNotifBtn = document.getElementById('test-notif-btn');
  if (testNotifBtn) testNotifBtn.addEventListener('click', sendTestNotification);
  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) confirmDialog('Import backup?', 'This replaces your current data with the contents of the backup file. This cannot be undone.', () => importData(file), 'Import');
    e.target.value = '';
  });
  const themeSwitch = document.getElementById('profile-theme-switch');
  if (state.settings.theme === 'dark') themeSwitch.style.setProperty('background', 'var(--primary)');
  themeSwitch.addEventListener('click', toggleTheme);
  const installBtn = document.getElementById('install-btn');
  if (deferredInstallPrompt) {
    installBtn.style.display = 'inline-flex';
    installBtn.addEventListener('click', async () => {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.style.display = 'none';
    });
  }
}
function openProfileEditModal() {

    <div class="modal-head"><h3>Edit profile</h3><button class="btn-icon" id="modal-close">✕</button></div>

  document.getElementById('modal-cancel').addEventListener('click', closeModal);

const AVATAR_EMOJIS = ['😀','😎','🤓','🥳','😇','🤩','🦄','🐱','🐶','🐼','🦊','🐸','🌻','🌟','🔥','🌈','🍀','⚡','🎯','🎨','📚','💪','🧘','☕'];
function openEmojiPickerModal() {
  const p = state.settings.profile;
  openModal(`
    <div class="modal-head"><h3>Choose an avatar</h3><button class="btn-icon" id="modal-close">✕</button></div>
    <div class="emoji-grid">
      ${AVATAR_EMOJIS.map(e => `<button type="button" class="emoji-opt ${p.avatarType==='emoji' && p.avatar===e ? 'selected':''}" data-emoji="${e}">${e}</button>`).join('')}

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.querySelectorAll('.emoji-opt').forEach(btn => btn.addEventListener('click', () => {
    state.settings.profile.avatar = btn.dataset.emoji;
    state.settings.profile.avatarType = 'emoji';
    persist('settings'); closeModal(); showToast('Avatar updated'); render();
  }));
  document.getElementById('use-initials-btn').addEventListener('click', () => {
    state.settings.profile.avatarType = 'initials';
    persist('settings'); closeModal(); showToast('Using initials as your avatar'); render();
  });
}
function openPinSetupModal(mode) {
  const needsCurrent = mode !== 'enable';
  openModal(`
    <div class="modal-head"><h3>${mode==='enable'?'Set up app lock':mode==='change'?'Change PIN':'Turn off app lock'}</h3><button class="btn-icon" id="modal-close">✕</button></div>
    ${needsCurrent ? `<div class="field"><label>Current PIN</label><input id="f-current-pin" autocomplete="off" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>` : ''}
    ${mode !== 'disable' ? `
    <div class="field"><label>New 4-digit PIN</label><input id="f-new-pin" autocomplete="off" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
    <div class="field"><label>Confirm PIN</label><input id="f-confirm-pin" autocomplete="off" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
    ` : `<p style="color:var(--muted); font-size:13px; line-height:1.5;">This removes your PIN and turns off app lock. Anyone with access to this browser will be able to open DailyLife.</p>`}
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn ${mode==='disable'?'btn-danger':'btn-primary'}" id="modal-save">${mode==='enable'?'Enable lock':mode==='change'?'Update PIN':'Turn off'}</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async () => {
    if (needsCurrent) {
      const cur = document.getElementById('f-current-pin').value;
      const hash = await hashPin(cur, state.settings.security.salt);
      if (hash !== state.settings.security.passwordHash) { showToast('Current PIN is incorrect', 'error'); return; }
    }
    if (mode === 'disable') {
      state.settings.security = { enabled: false, passwordHash: null, salt: null, biometricEnabled: false, credentialId: null };
      persist('settings'); closeModal(); showToast('App lock turned off'); render();
      return;
    }
    const np = document.getElementById('f-new-pin').value;
    const cp = document.getElementById('f-confirm-pin').value;
    if (!/^\d{4}$/.test(np)) { showToast('PIN must be exactly 4 digits', 'error'); return; }
    if (np !== cp) { showToast('PINs do not match', 'error'); return; }
    const salt = bufToBase64(crypto.getRandomValues(new Uint8Array(16)).buffer);
    const hash = await hashPin(np, salt);
    state.settings.security.enabled = true;
    state.settings.security.salt = salt;
    state.settings.security.passwordHash = hash;
    persist('settings'); closeModal(); showToast(mode === 'enable' ? 'App lock enabled' : 'PIN updated'); render();
    if (mode === 'enable' && !backGuardArmed) armBackGuard(); // so the back button locks immediately, without needing a reload
  });
}

/* ---- init ---- */
if (state.settings.security.enabled) { showLockScreen(); } else { applyTheme(); bootApp(); }
